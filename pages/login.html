<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Login - Chill App</title>
    <link
      rel="icon"
      href="../images/logo-icon.png"
      type="image/x-icon"
    />
    <link
      rel="stylesheet"
      href="../styles/authentication.css"
    />
  </head>
  <body>
    <main>
      <img
        class="logo"
        src="../images/logo.png"
        alt="Chill App Logo"
        width="50"
      />
      <div class="header">
        <h1>Masuk</h1>
        <p>Selamat datang kembali!</p>
      </div>
      <form
        action=""
        method="post"
      >
        <div class="form-group">
          <label for="username">Username:</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            placeholder="Masukan username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi:</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            placeholder="Masukan Kata Sandi"
            required
          />

          <img
            src="../images/eye-off-icon.png "
            alt="Eye Icon"
            width="20"
          />
          <div class="auth-action">
            <p>Belum punya akun? <a href="register.html">Daftar</a></p>
            <p><a href="#">Lupa kata sandi?</a></p>
          </div>
        </div>
        <div class="form-action">
          <button type="submit">Masuk</button>
          <p>Atau</p>
          <button type="button">
            <img
              src="../images/google-icon.png"
              alt="Google Icon"
              width="20"
            />
            Masuk dengan Google
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
